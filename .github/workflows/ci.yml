name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build and test (Linux)
        if: runner.os == 'Linux'
        run: |
          make
          make test

      - name: Build and test (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          build.bat
          build.bat test
